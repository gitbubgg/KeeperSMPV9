name: Build plugin jar

on:
  push:
  workflow_dispatch:
    inputs:
      debug_fetch_geyser_config:
        description: 'Print Geyser-Spigot/Floodgate config over SFTP (debug only, does not build or deploy)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: KeeperSMP-jar
          path: target/KeeperSMP.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KeeperSMP-jar
      - name: Upload jar to FalixNodes over SFTP
        env:
          FALIX_SFTP_HOST: ${{ secrets.FALIX_SFTP_HOST }}
          FALIX_SFTP_PORT: ${{ secrets.FALIX_SFTP_PORT }}
          FALIX_SFTP_USER: ${{ secrets.FALIX_SFTP_USER }}
          FALIX_SFTP_PASSWORD: ${{ secrets.FALIX_SFTP_PASSWORD }}
        run: |
          # FALIX_SFTP_HOST may be a bare host, or the whole
          # "sftp://user@host:port" string the panel shows you. Pull it apart
          # so either form works.
          raw="${FALIX_SFTP_HOST#sftp://}"
          raw="${raw%%/*}"
          if [[ "$raw" == *"@"* ]]; then
            embedded_user="${raw%%@*}"
            raw="${raw#*@}"
          else
            embedded_user=""
          fi
          host="${raw%%:*}"
          if [[ "$raw" == *":"* ]]; then
            embedded_port="${raw#*:}"
          else
            embedded_port=""
          fi

          user="${FALIX_SFTP_USER:-$embedded_user}"
          port="${FALIX_SFTP_PORT:-${embedded_port:-22}}"

          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass

          echo "Connecting to sftp://$host:$port as $user"
          export SSHPASS="$FALIX_SFTP_PASSWORD"
          echo "put KeeperSMP.jar /plugins/KeeperSMP.jar" | sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -P "$port" \
            "${user}@${host}"
      - name: Patch server.properties (spawn-protection, transfers)
        env:
          FALIX_SFTP_HOST: ${{ secrets.FALIX_SFTP_HOST }}
          FALIX_SFTP_PORT: ${{ secrets.FALIX_SFTP_PORT }}
          FALIX_SFTP_USER: ${{ secrets.FALIX_SFTP_USER }}
          FALIX_SFTP_PASSWORD: ${{ secrets.FALIX_SFTP_PASSWORD }}
        run: |
          # Vanilla's own spawn-protection setting blocks non-op players (and
          # Bedrock/Floodgate players, who are never op) from interacting with
          # blocks near spawn entirely, before KeeperSMP's own Protect system
          # or Crates' click handler ever sees the event. KeeperSMP already
          # protects spawn itself, so turn the redundant vanilla one off.
          #
          # accepts-transfers=true lets FalixNodes' front-end gateway hand
          # connections off to this backend with a protocol-level Transfer
          # packet. Geyser has to translate that for Bedrock clients, and
          # that translation is the leading suspect for the "Transferred to
          # another server" issue Bedrock players keep hitting even once the
          # server is confirmed up. Turned off as a test fix.
          #
          # Runs every deploy so a panel reset can't silently bring either back.
          raw="${FALIX_SFTP_HOST#sftp://}"
          raw="${raw%%/*}"
          if [[ "$raw" == *"@"* ]]; then
            embedded_user="${raw%%@*}"
            raw="${raw#*@}"
          else
            embedded_user=""
          fi
          host="${raw%%:*}"
          if [[ "$raw" == *":"* ]]; then
            embedded_port="${raw#*:}"
          else
            embedded_port=""
          fi
          user="${FALIX_SFTP_USER:-$embedded_user}"
          port="${FALIX_SFTP_PORT:-${embedded_port:-22}}"

          export SSHPASS="$FALIX_SFTP_PASSWORD"
          echo "get server.properties server.properties" | sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -P "$port" \
            "${user}@${host}"

          if [ -f server.properties ]; then
            if grep -q '^spawn-protection=' server.properties; then
              sed -i 's/^spawn-protection=.*/spawn-protection=0/' server.properties
            else
              echo 'spawn-protection=0' >> server.properties
            fi
            if grep -q '^accepts-transfers=' server.properties; then
              sed -i 's/^accepts-transfers=.*/accepts-transfers=false/' server.properties
            else
              echo 'accepts-transfers=false' >> server.properties
            fi
            echo "put server.properties server.properties" | sshpass -e sftp \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -P "$port" \
              "${user}@${host}"
          else
            echo "::warning::Could not download server.properties over SFTP; spawn-protection/accepts-transfers were left unchanged."
          fi
      - name: Merge new config.yml keys onto the server
        env:
          FALIX_SFTP_HOST: ${{ secrets.FALIX_SFTP_HOST }}
          FALIX_SFTP_PORT: ${{ secrets.FALIX_SFTP_PORT }}
          FALIX_SFTP_USER: ${{ secrets.FALIX_SFTP_USER }}
          FALIX_SFTP_PASSWORD: ${{ secrets.FALIX_SFTP_PASSWORD }}
        run: |
          # saveDefaultConfig() only ever writes config.yml once, the very
          # first time the plugin starts; it never merges new keys into an
          # existing file. Every config section a later commit adds (shop
          # entries, daily, playtime, bonus-events, sidebar, end-loot, ...)
          # would otherwise silently never exist on a server that already
          # has a config.yml, forever. Pull the live file down, add anything
          # missing from the repo's default (comments and formatting of
          # what's already there are left untouched), and push it back.
          raw="${FALIX_SFTP_HOST#sftp://}"
          raw="${raw%%/*}"
          if [[ "$raw" == *"@"* ]]; then
            embedded_user="${raw%%@*}"
            raw="${raw#*@}"
          else
            embedded_user=""
          fi
          host="${raw%%:*}"
          if [[ "$raw" == *":"* ]]; then
            embedded_port="${raw#*:}"
          else
            embedded_port=""
          fi
          user="${FALIX_SFTP_USER:-$embedded_user}"
          port="${FALIX_SFTP_PORT:-${embedded_port:-22}}"

          export SSHPASS="$FALIX_SFTP_PASSWORD"
          echo "get plugins/KeeperSMP/config.yml server-config.yml" | sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -P "$port" \
            "${user}@${host}"

          if [ -f server-config.yml ]; then
            pip install --quiet ruamel.yaml
            python3 .github/scripts/merge_config.py
            echo "put server-config.yml plugins/KeeperSMP/config.yml" | sshpass -e sftp \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -P "$port" \
              "${user}@${host}"
          else
            echo "::warning::Could not download config.yml over SFTP; new config keys were not merged."
          fi
      - name: Restart server so the new jar loads
        env:
          FALIX_PANEL_URL: ${{ secrets.FALIX_PANEL_URL }}
          FALIX_SERVER_ID: ${{ secrets.FALIX_SERVER_ID }}
          FALIX_API_KEY: ${{ secrets.FALIX_API_KEY }}
        run: |
          curl -sS --fail-with-body -X POST \
            "${FALIX_PANEL_URL%/}/api/client/servers/${FALIX_SERVER_ID}/power" \
            -H "Authorization: Bearer ${FALIX_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) KeeperSMP-Deploy" \
            -d '{"signal":"restart"}' \
          || echo "::warning::Could not trigger an automatic restart (the FalixNodes panel API may be blocking scripted requests). The new jar is uploaded, but you'll need to restart the server manually from the panel to load it."

  debug-geyser-config:
    if: github.event_name == 'workflow_dispatch' && inputs.debug_fetch_geyser_config == true
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and print Geyser-Spigot/Floodgate config over SFTP
        env:
          FALIX_SFTP_HOST: ${{ secrets.FALIX_SFTP_HOST }}
          FALIX_SFTP_PORT: ${{ secrets.FALIX_SFTP_PORT }}
          FALIX_SFTP_USER: ${{ secrets.FALIX_SFTP_USER }}
          FALIX_SFTP_PASSWORD: ${{ secrets.FALIX_SFTP_PASSWORD }}
        run: |
          # Read-only diagnostic for the Bedrock "Transferred to another
          # server" issue: prints the remote/address settings Geyser and
          # Floodgate are actually using on the live server, since a stale
          # or mismatched remote address (e.g. after FalixNodes moves the
          # server to a different node) is the leading suspect.
          raw="${FALIX_SFTP_HOST#sftp://}"
          raw="${raw%%/*}"
          if [[ "$raw" == *"@"* ]]; then
            embedded_user="${raw%%@*}"
            raw="${raw#*@}"
          else
            embedded_user=""
          fi
          host="${raw%%:*}"
          if [[ "$raw" == *":"* ]]; then
            embedded_port="${raw#*:}"
          else
            embedded_port=""
          fi
          user="${FALIX_SFTP_USER:-$embedded_user}"
          port="${FALIX_SFTP_PORT:-${embedded_port:-22}}"

          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass
          export SSHPASS="$FALIX_SFTP_PASSWORD"

          for f in "plugins/Geyser-Spigot/config.yml" "plugins/floodgate/config.yml" "server.properties"; do
            out="downloaded_$(basename "$f")"
            echo "get $f $out" | sshpass -e sftp \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -P "$port" \
              "${user}@${host}" || true
            echo "::group::$f"
            if [ -f "$out" ]; then cat "$out"; else echo "(could not download $f)"; fi
            echo "::endgroup::"
          done
