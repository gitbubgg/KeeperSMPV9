# ============================================================
#  KeeperSMP configuration
# ============================================================

general:
  currency-symbol: '$'
  starting-balance: 500.0
  # Worlds /rtp and /rtpq are allowed to drop you into.
  rtp-worlds: [world]
  rtp-radius: 5000
  rtp-min-radius: 250
  # Leave the *-worlds lists empty to auto-detect by dimension type instead.
  rtp-nether-worlds: [world_nether]
  rtp-nether-radius: 3000
  rtp-nether-min-radius: 100
  rtp-end-worlds: [world_the_end]
  rtp-end-radius: 200
  rtp-end-min-radius: 20
  # The Sift's own dedicated world, created automatically on first startup.
  rtp-sift-world: sift
  combat-tag-seconds: 20
  # Kill hostile mobs that wander into chunks where everyone nearby has
  # mob spawning switched off.
  mob-cull-enabled: true
  mob-cull-radius: 64
  # /sell price for anything NOT listed under sell: below, so everything is
  # sellable somewhere. Crate keys are always excluded, whatever this is.
  default-sell-price: 1.0
  # extra fraction of an elytra's /sell price added per total enchantment
  # level on it (e.g. Unbreaking III + Mending I = 4 levels).
  elytra-enchant-bonus-per-level: 0.1
  # Doubles /sell payouts and /afk shard income every Saturday/Sunday
  # (server's local clock).
  weekend-bonus-enabled: true
  weekend-bonus-multiplier: 2.0

# ------------------------------------------------------------
#  Client resource pack pushed to players on join - currently just the
#  Sift reskins (Sift Stone, Sift Grass, Songwood). Re-run
#  resourcepack/build.sh and update url/sha1 here whenever the pack's
#  source files under resourcepack/src change.
# ------------------------------------------------------------
resourcepack:
  url: "https://raw.githubusercontent.com/gitbubgg/KeeperSMPV9/main/resourcepack/keepersmp-sift.zip"
  sha1: "5150450ef01e3ce1a9f195437d62afaea2b9c098"
  required: false

auction:
  # Cost to sponsor a listing (pin it to the top of /ah) is this fraction of
  # the item's guaranteed /sell value (or the listing price if higher),
  # multiplied by however many hours you sponsor it for.
  sponsor-cost-percent-per-hour: 0.02

stripe:
  enabled: true
  # RESTRICTED key only (rk_live_... or rk_test_...), with READ access to
  # Checkout Sessions and Subscriptions. Nothing else. Never put a secret
  # key (sk_...) here.
  secret-key: 'PASTE_YOUR_RESTRICTED_KEY_HERE'
  poll-seconds: 60
  # Minutes a /rank checkout code stays valid.
  code-ttl-minutes: 30
  links:
    KEEPER_PLUS: 'https://buy.stripe.com/bJefZj9ks99h9Gq6JK73G00'
    KEEPER_PLUS2: 'https://buy.stripe.com/4gM7sN54cetBbOyb0073G01'
    KEEPER_PLUS3: 'https://buy.stripe.com/4gM8wR68g4T16ueb0073G02'
  # Cents, used to work out which tier a completed checkout paid for.
  amounts:
    KEEPER_PLUS: 350
    KEEPER_PLUS2: 650
    KEEPER_PLUS3: 1100

# Usernames are matched case-insensitively. Bedrock accounts arrive through
# Floodgate with the prefix configured in Floodgate's config (default '.'),
# and spaces in a gamertag become underscores, so both spellings are listed.
staff:
  owner:
    - 'Ytismyfav'
    - '.HappyVids3312'
  admin: []
  mod:
    - '.Fitz fun5811'
    - '.Fitz_fun5811'
    - '.SloppyStar3815'

# Set any of these to false to switch the perk off server-wide.
# sell-bonus and shop-discount are the two perks most likely to be read as
# selling gameplay advantage under Mojang's commercial guidelines.
