# ============================================================
#  KeeperSMP configuration
# ============================================================

general:
  currency-symbol: '$'
  starting-balance: 500.0
  # Worlds /rtp and /rtpq are allowed to drop you into.
  rtp-worlds: [world]
  rtp-radius: 5000
  rtp-min-radius: 250
  combat-tag-seconds: 20
  # Kill hostile mobs that wander into chunks where everyone nearby has
  # mob spawning switched off.
  mob-cull-enabled: true
  mob-cull-radius: 64

stripe:
  enabled: false
  # RESTRICTED key only (rk_live_... or rk_test_...), with READ access to
  # Checkout Sessions and Subscriptions. Nothing else. Never put a secret
  # key (sk_...) here.
  secret-key: 'PASTE_YOUR_RESTRICTED_KEY_HERE'
  poll-seconds: 60
  # Minutes a /rank checkout code stays valid.
  code-ttl-minutes: 30
  links:
    KEEPER_PLUS: 'https://buy.stripe.com/bJefZj9ks99h9Gq6JK73G00'
    KEEPER_PLUS2: 'https://buy.stripe.com/4gM7sN54cetBbOyb0073G01'
    KEEPER_PLUS3: 'https://buy.stripe.com/4gM8wR68g4T16ueb0073G02'
  # Cents, used to work out which tier a completed checkout paid for.
  amounts:
    KEEPER_PLUS: 350
    KEEPER_PLUS2: 650
    KEEPER_PLUS3: 1100

# Usernames are matched case-insensitively. Bedrock accounts arrive through
# Floodgate with the prefix configured in Floodgate's config (default '.'),
# and spaces in a gamertag become underscores, so both spellings are listed.
staff:
  owner:
    - 'Ytismyfav'
    - '.HappyVids3312'
  admin: []
  mod:
    - '.Fitz fun5811'
    - '.Fitz_fun5811'
    - '.SloppyStar3815'

# Set any of these to false to switch the perk off server-wide.
# sell-bonus and shop-discount are the two perks most likely to be read as
# selling gameplay advantage under Mojang's commercial guidelines.
perks:
  sell-bonus: true
  shop-discount: true
  auction-tax: true
  priority-join: true
  nickname-colour: true

