# ------------------------------------------------------------
#  Crates  -  the KEY decides the loot, not the crate block.
#  Staff mark a block as a crate with /setcrate.
#  weight is relative within a tier. money and shards can be
#  used instead of an item.
# ------------------------------------------------------------
crates:
  # Logs every crate interaction to the console. Turn on only while working
  # out why a client's clicks are not registering.
  debug: false
  COMMON:
    name: '&7Common Key'
    # Trial keys cannot be placed as blocks, which matters: a placeable key
    # gets consumed by a misclick or blocked by spawn protection.
    key-item: TRIAL_KEY
    rolls: 3
    daily-limits:
      sword: 2
      chestplate: 2
      helmet: 2
      leggings: 2
      boots: 2
      pickaxe: 2
      axe: 2
    loot:
      - { item: IRON_INGOT, min: 8, max: 24, weight: 26 }
      - { item: GOLD_INGOT, min: 4, max: 12, weight: 18 }
      - { item: COAL, min: 16, max: 32, weight: 16 }
      - { item: DIAMOND, min: 1, max: 3, weight: 10 }
      - { item: GOLDEN_APPLE, min: 1, max: 2, weight: 8 }
