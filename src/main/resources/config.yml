# ------------------------------------------------------------
#  Spawn protection
#  A circle around the world spawn point, which /buildspawn
#  sets. Staff (Mod and above) are exempt.
# ------------------------------------------------------------
protection:
  enabled: true
  radius: 45
  # Set false to test protection on your own staff account.
  staff-bypass: true
  # No PvP damage between players while either one is inside the protected
  # circle (which follows /setlobby, since that also moves world spawn).
  disable-pvp: true

# ------------------------------------------------------------
#  Death drops go into a chest at the death spot instead of scattering.
#  Only the owner (or staff) can open it until it expires.
# ------------------------------------------------------------
deathchest:
  minutes: 10

# ------------------------------------------------------------
#  Heuristic x-ray flag: mining valuable ore that had no exposed face
#  before it broke means it couldn't have been legitimately spotted.
#  This many "blind" breaks within the window pings online staff.
#  Staff/owner ranks are never flagged.
# ------------------------------------------------------------
xray:
  window-seconds: 120
  alert-threshold: 3

# ------------------------------------------------------------
#  Heuristic macro/autoclicker flag, same idea as x-ray above: pings
#  online staff, isn't proof. Two tells - sustained click rate while
#  attacking, and repeatedly acting with zero movement/camera change
#  (the classic sign of an unattended AFK macro). Staff/owner exempt.
# ------------------------------------------------------------
macro:
  max-sustained-cps: 15
  still-action-threshold: 80

# ------------------------------------------------------------
#  TNT spawner block, run by the plugin rather than by vanilla
# ------------------------------------------------------------
tnt-spawner:
  interval-seconds: 3
  trigger-radius: 12
  fuse-ticks: 60
  tnt-per-cycle: 1
  # Blocks above the spawner that the TNT appears at.
  spawn-height: 0.6
  # Keeps the spawner from being destroyed by its own TNT. Set false if you
  # would rather it be consumed after a few blasts.
  protect-block: true

# ------------------------------------------------------------
#  /daily  -  one reward per calendar day. Missing a day resets
#  the streak back to day 1. The table cycles after cycle-days.
# ------------------------------------------------------------
daily:
  cycle-days: 7
  rewards:
    1: { money: 200,  shards: 5 }
    2: { money: 250,  shards: 6 }
    3: { money: 300,  shards: 8 }
    4: { money: 400,  shards: 10 }
    5: { money: 500,  shards: 12 }
    6: { money: 650,  shards: 15 }
    7: { money: 1000, shards: 25 }

# ------------------------------------------------------------
#  One-time rewards for total playtime. Key is minutes played.
#  item is optional, item-amount defaults to 1.
# ------------------------------------------------------------
playtime:
  milestones:
    60:   { money: 500,   shards: 20 }
    300:  { money: 1500,  shards: 60 }
    600:  { money: 3000,  shards: 120 }
    1500: { money: 7500,  shards: 300,  item: NETHERITE_INGOT,   item-amount: 1 }
    3000: { money: 15000, shards: 600,  item: NETHERITE_INGOT,   item-amount: 3 }
    6000: { money: 30000, shards: 1200, item: TOTEM_OF_UNDYING,  item-amount: 2 }

# ------------------------------------------------------------
#  A scheduled, server-wide surprise reward. Everyone online when
#  it fires gets the same randomised amount.
# ------------------------------------------------------------
bonus-events:
  enabled: true
  interval-minutes: 45
  money-min: 100
  money-max: 500
  shards-min: 5
  shards-max: 25

# ------------------------------------------------------------
#  Always-on personal stats panel on the side of the screen.
# ------------------------------------------------------------
sidebar:
  enabled: true

# ------------------------------------------------------------
#  Elytra is a limited, priced /shop item now, so strip the free
#  ones vanilla places in End City ships as chunks load.
# ------------------------------------------------------------
end-loot:
  remove-elytra: true

# ------------------------------------------------------------
#  Ancient debris is a genuinely finite resource: once this many
#  have been mined out of the world, no more can be broken.
# ------------------------------------------------------------
nether-limit:
  ancient-debris: 25000

# ------------------------------------------------------------
#  /gunfight  -  queues two players for a 1v1 duel with a random
#  reskinned ranged weapon ("gun"). Key is minutes played needed to
#  unlock that tier for the random pool; power is a Power enchant
#  level, multishot only applies to a CROSSBOW material.
#  Set the two arena spawn points in-game with /gunfight setpos1
#  and /gunfight setpos2 (staff only); falls back to /lobby if unset.
# ------------------------------------------------------------
gunfight:
  reward-money: 5000
  arena:
    pos1: null
    pos2: null
  tiers:
    0:    { name: "&7Rusty Pistol",  material: CROSSBOW, power: 1 }
    60:   { name: "&fSMG",           material: BOW,       power: 2 }
    300:  { name: "&eShotgun",       material: CROSSBOW,  power: 2, multishot: true }
    1000: { name: "&6Sniper Rifle",  material: BOW,       power: 4 }
    3000: { name: "&cRailgun",       material: CROSSBOW,  power: 5, multishot: true }

# ------------------------------------------------------------
#  /gamble  -  coin-flip wager, either directly against a named player
#  (accept/deny) or against whoever else queues the same amount.
# ------------------------------------------------------------
gamble:
  house-cut-percent: 0.05
